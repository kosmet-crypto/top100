<!DOCTYPE html>
<html lang="sr">
<head>

<style>
:root{
  --bg:#0e0e13; --surface:#16161e; --surface2:#1f202b; --line:#2a2b3a;
  --text:#f4f4f8; --muted:#8e90a6; --accent:#ff5d4d; --accent-ink:#ffffff;
  --accent-soft:rgba(255,93,77,.15); --pos:#38d68f; --neg:#ff6b7f; --gold:#ffc24b;
  --pos-soft:rgba(56,214,143,.14); --neg-soft:rgba(255,107,127,.14); --gold-soft:rgba(255,194,75,.14);
  --shadow:0 18px 40px -18px rgba(0,0,0,.75);
  --font:"Manrope",ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme=light]{
  --bg:#f4f3f7; --surface:#ffffff; --surface2:#eeedf4; --line:#e0dfea;
  --text:#16151d; --muted:#6a6a80; --accent:#e8412f; --accent-ink:#ffffff;
  --accent-soft:rgba(232,65,47,.1); --pos:#0f9d63; --neg:#dc3852; --gold:#c98a00;
  --pos-soft:rgba(15,157,99,.1); --neg-soft:rgba(220,56,82,.1); --gold-soft:rgba(201,138,0,.12);
  --shadow:0 18px 40px -22px rgba(40,30,60,.35);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme=dark]){
    --bg:#f4f3f7; --surface:#ffffff; --surface2:#eeedf4; --line:#e0dfea;
    --text:#16151d; --muted:#6a6a80; --accent:#e8412f; --accent-ink:#ffffff;
    --accent-soft:rgba(232,65,47,.1); --pos:#0f9d63; --neg:#dc3852; --gold:#c98a00;
    --pos-soft:rgba(15,157,99,.1); --neg-soft:rgba(220,56,82,.1); --gold-soft:rgba(201,138,0,.12);
    --shadow:0 18px 40px -22px rgba(40,30,60,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.35;min-height:100vh;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
#app{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 110px)}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.12rem;letter-spacing:-.02em}
.brand svg{width:28px;height:28px}
.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.icon:active{background:var(--surface2)}
.icon svg{width:22px;height:22px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.9rem;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.sm{padding:6px 12px;font-size:.84rem}
.chip.add{border-style:dashed}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.lhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:6px 2px 12px}
.lhead h1{font-size:1.55rem;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.lhead p{color:var(--muted);font-weight:600;font-size:.86rem;margin-top:3px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:700;font-size:.9rem;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--text)}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-weight:600;outline:none}
.search input:focus{border-color:var(--accent)}
.search .icon{background:var(--surface);border:1px solid var(--line);width:46px;height:46px;border-radius:14px;color:var(--text)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:34px 38px 1fr auto;align-items:center;gap:6px;padding:10px 12px 10px 8px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:active{background:var(--surface2)}
.pos{font-weight:800;font-size:1.02rem;text-align:center;font-variant-numeric:tabular-nums}
.row.p1 .pos{color:var(--gold)}
.mv{font-size:.74rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.mv.up{color:var(--pos)} .mv.dn{color:var(--neg)} .mv.eq{color:var(--muted);opacity:.6}
.badge{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.04em;padding:3px 5px;border-radius:6px}
.badge.new{background:var(--accent-soft);color:var(--accent)}
.badge.re{background:var(--gold-soft);color:var(--gold)}
.main{min-width:0}
.main .t{font-weight:700;font-size:.98rem;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.main .a{color:var(--muted);font-weight:600;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pl{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pos);margin-left:6px;vertical-align:middle}
.sc{text-align:right;font-variant-numeric:tabular-nums}
.sc b{display:block;font-size:1.05rem;font-weight:800}
.sc small{display:block;color:var(--muted);font-weight:700;font-size:.72rem;white-space:nowrap}
.cut{display:block;width:100%;padding:12px;text-align:center;color:var(--muted);font-weight:700;font-size:.82rem;border-top:1px dashed var(--line);background:var(--bg)}
.empty{text-align:center;color:var(--muted);font-weight:600;padding:36px 20px;line-height:1.5}
.empty h2{color:var(--text);font-size:1.3rem;font-weight:800;margin-bottom:8px;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:800;font-size:.95rem;background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--neg)}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45}
.btn svg{width:18px;height:18px}
.stack{display:flex;flex-direction:column;gap:10px}
.mt{margin-top:12px}
.fab{position:fixed;right:max(16px,calc(50vw - 324px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:20;display:flex;align-items:center;gap:8px;padding:15px 20px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:800;box-shadow:var(--shadow)}
.fab svg{width:20px;height:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.card h3{font-size:1rem;font-weight:800;margin-bottom:4px}
.card p,.note{color:var(--muted);font-weight:600;font-size:.86rem;line-height:1.45}
.hist{cursor:pointer}
.hist .d{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hist .d b{font-weight:800}
.hist .d span{color:var(--muted);font-weight:700;font-size:.82rem}
/* round */
.rhead{background:var(--accent-soft);border:1px solid var(--accent);border-radius:18px;padding:12px 14px;margin:4px 0 12px}
.rhead h1{font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
.rhead p{color:var(--muted);font-weight:600;font-size:.86rem;margin-top:2px}
.rhead p button{color:var(--accent);font-weight:800;text-decoration:underline}
.rrow{display:grid;grid-template-columns:30px 1fr auto;grid-template-areas:"pos t t" "pos a ctl";align-items:center;gap:4px 8px;padding:9px 10px 9px 6px;border-top:1px solid var(--line)}
.rrow .pos{grid-area:pos}
.rrow .t{grid-area:t;font-weight:700;font-size:.98rem;line-height:1.25}
.rrow .a{grid-area:a;color:var(--muted);font-weight:600;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rrow .ctl{grid-area:ctl}
@media (min-width:560px){ .rrow{grid-template-areas:"pos t ctl" "pos a ctl"} }
.rrow:first-child{border-top:0}
.rrow.on{background:var(--accent-soft)}
.rrow .a span{color:var(--text);opacity:.75}
.ctl{display:flex;align-items:center;gap:4px}
.ctl button{width:38px;height:38px;border-radius:11px;background:var(--surface2);font-weight:800;font-size:.9rem}
.ctl button:active{background:var(--accent);color:var(--accent-ink)}
.ctl button.mi{color:var(--muted)}
.ctl input{width:44px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--bg);text-align:center;font-weight:800;outline:none;-moz-appearance:textfield}
.ctl input:focus{border-color:var(--accent)}
.ctl input::-webkit-outer-spin-button,.ctl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rrow.on .ctl input{border-color:var(--accent);color:var(--accent)}
.hide{display:none!important}
.rbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px)}
.rbar .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:8px}
.rbar .info{flex:1;min-width:0;font-weight:700;font-size:.86rem;color:var(--muted)}
.rbar .info b{color:var(--text)}
.rbar .icon{background:var(--surface2)}
/* sheet */
#sheetRoot{position:fixed;inset:0;z-index:50;display:none}
#sheetRoot.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .2s}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 22px);animation:up .22s ease-out}
.sheet .grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:1.25rem;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.sheet .sub{color:var(--muted);font-weight:600;font-size:.88rem;margin-bottom:14px}
.sheet h4{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
@keyframes up{from{transform:translate(-50%,40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.lbl{display:block;font-size:.8rem;font-weight:800;color:var(--muted);margin:12px 0 6px}
.field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-weight:600;outline:none}
.field:focus{border-color:var(--accent)}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.check{display:flex;align-items:center;gap:10px;font-weight:700;margin:14px 0 4px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.tile{background:var(--surface2);border-radius:14px;padding:10px 8px;text-align:center}
.tile b{display:block;font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.tile span{display:block;color:var(--muted);font-weight:700;font-size:.72rem;margin-top:1px}
.chart{width:100%;height:auto;display:block;background:var(--surface2);border-radius:14px}
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.years label{display:block;background:var(--surface2);border-radius:12px;padding:6px 8px 8px}
.years label span{display:block;font-size:.74rem;font-weight:800;color:var(--muted);margin-bottom:3px}
.years input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 8px;font-weight:800;outline:none;text-align:center}
.mini{list-style:none}
.mini li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-weight:600;font-size:.92rem}
.mini li:first-child{border-top:0}
.mini li .n{width:30px;text-align:center;font-weight:800;color:var(--muted);flex:none}
.mini li .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini li .x small{color:var(--muted);font-weight:600}
.mini li .r{font-weight:800;flex:none}
.hero{background:linear-gradient(135deg,var(--accent),#ff9a3d);color:#fff;border-radius:18px;padding:16px;margin:4px 0 6px}
.hero small{font-weight:800;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero b{display:block;font-size:1.25rem;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.hero span{font-weight:700;opacity:.9}
.imp{background:var(--surface2);border-radius:16px;padding:12px;margin-bottom:12px}
.imp.off{opacity:.55}
.imp .hd{display:flex;align-items:center;gap:10px}
.imp .hd input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.imp .hd .field{padding:8px 10px}
.cols{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:thin}
.col{flex:none;width:118px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.col .h{font-weight:800;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col .v{color:var(--muted);font-weight:600;font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 6px}
.col select{width:100%;font-size:.78rem;padding:6px 22px 6px 7px;border-radius:9px}
.col.skip{opacity:.55}
.warn{background:var(--neg-soft);color:var(--neg);border-radius:12px;padding:9px 12px;font-weight:700;font-size:.84rem;margin-top:8px}
.warn details summary{cursor:pointer}
.warn ul{margin:6px 0 0 18px;font-weight:600}
.ok{background:var(--pos-soft);color:var(--pos);border-radius:12px;padding:9px 12px;font-weight:700;font-size:.84rem;margin-top:8px}
.prev{color:var(--muted);font-weight:600;font-size:.84rem;margin-top:8px;line-height:1.5}
.prev b{color:var(--text)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:.22s;z-index:80;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<div id="sheetRoot"></div>

const TR_L = {'Lj':'Љ','LJ':'Љ','lj':'љ','Nj':'Њ','NJ':'Њ','nj':'њ','Dž':'Џ','DŽ':'Џ','dž':'џ'};
const TR_1 = {a:'а',b:'б',v:'в',g:'г',d:'д',đ:'ђ',e:'е',ž:'ж',z:'з',i:'и',j:'ј',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',r:'р',s:'с',t:'т',ć:'ћ',u:'у',f:'ф',h:'х',c:'ц',č:'ч',š:'ш'};
function toCyr(s){
  return s.split(/(\[\[.*?\]\]|\{\d+\})/).map(part => {
    if(part.startsWith('[[')) return part.slice(2,-2);
    if(/^\{\d+\}$/.test(part)) return part;
    let out = '';
    for(let i=0;i<part.length;i++){
      const two = part.substr(i,2);
      if(TR_L[two]){ out += TR_L[two]; i++; continue; }
      const ch = part[i], lo = ch.toLowerCase(), m = TR_1[lo];
      out += m ? (ch===lo ? m : m.toUpperCase()) : ch;
    }
    return out;
  }).join('');
}
function lang(){ return data.settings.lang || defaultLang(); }
function defaultLang(){
  const l = (navigator.language||'').toLowerCase();
  if(l.startsWith('sr-latn') || /^(hr|bs|sh|me|cnr)/.test(l)) return 'sr';
  if(l.startsWith('sr')) return 'sr-Cyrl';
  return 'en';
}
function T(s, ...a){
  const L = lang();
  let r = L==='en' ? (EN[s] || s) : s;
  r = L==='sr-Cyrl' ? toCyr(r) : r.replace(/\[\[|\]\]/g,'');
  return r.replace(/\{(\d+)\}/g, (_,i) => a[i]!=null ? a[i] : '');
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let idSeq = 0;
const uid = () => Date.now().toString(36) + (idSeq++).toString(36) + Math.random().toString(36).slice(2,5);
const CY = () => new Date().getFullYear();
const fmt = n => { n = +n || 0; return Number.isInteger(n) ? String(n) : String(Math.round(n*10)/10).replace('.', lang()==='en'?'.':','); };
const fdate = iso => { const d = new Date(iso); return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear()+'.'; };
const CYR2LAT = {а:'a',б:'b',в:'v',г:'g',д:'d',ђ:'dj',е:'e',ж:'z',з:'z',и:'i',ј:'j',к:'k',л:'l',љ:'lj',м:'m',н:'n',њ:'nj',о:'o',п:'p',р:'r',с:'s',т:'t',ћ:'c',у:'u',ф:'f',х:'h',ц:'c',ч:'c',џ:'dz',ш:'s'};
/* Loose form for matching: lower case, Latin, no diacritics, single spaces. */
function norm(s){
  return String(s ?? '').toLowerCase().replace(/[а-яђјљњћџ]/g, c => CYR2LAT[c] ?? c).replace(/đ/g,'dj')
    .normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9#+✓✔✅]+/g,' ').trim();
}
const songKey = s => norm(s.title) + '|' + norm(s.artist);

const listById = id => data.lists.find(l => l.id === id);
function curList(){ return listById(data.cur) || data.lists[0] || null; }
const songsOf = id => data.songs.filter(s => s.list === id);
const songById = id => data.songs.find(s => s.id === id);
const roundsOf = id => data.rounds.filter(r => r.list === id);
const total = s => { let t = 0; for(const y in s.pts) t += +s.pts[y] || 0; return t; };
function yearsOf(l, withCur){
  const ys = new Set(); songsOf(l.id).forEach(s => { for(const y in s.pts) if(+s.pts[y]) ys.add(+y); });
  if(withCur) ys.add(CY());
  return [...ys].sort((a,b) => a-b);
}
function rankLabel(l){
  return l.rank==='year' ? T('Tekuća godina') : l.rank==='last' ? T('Poslednjih {0} godina', l.lastN||3) : T('Sve godine');
}
function score(s, l, period){
  if(period !== 'cur') return +s.pts[period] || 0;
  if(l.rank === 'year') return +s.pts[CY()] || 0;
  if(l.rank === 'last'){ const from = CY() - (l.lastN||3) + 1; let t = 0; for(const y in s.pts) if(+y >= from) t += +s.pts[y] || 0; return t; }
  return total(s);
}
const orderMap = ids => { const m = new Map(); ids.forEach((id,i) => m.set(id, i+1)); return m; };
function baseMap(l){ return l.base ? new Map(Object.entries(l.base).map(([k,v]) => [k,+v])) : new Map(); }
/* The standing everyone agrees on right now: the order after the latest round (or the import). */
function standing(l){ const rs = roundsOf(l.id); return rs.length ? orderMap(rs[rs.length-1].order) : baseMap(l); }
/* Ranking; ties go to the higher total, then to whoever stood higher before. */
function ranked(l, period = 'cur', tie){
  tie = tie || (period === 'cur' ? standing(l) : new Map());
  let arr = songsOf(l.id).map(s => ({ s, sc:score(s,l,period), t:total(s), p:tie.get(s.id) ?? 1e9 }));
  if(period !== 'cur') arr = arr.filter(x => x.sc);
  arr.sort((a,b) => b.sc-a.sc || b.t-a.t || a.p-b.p || a.s.title.localeCompare(b.s.title));
  return arr.map(x => x.s);
}
/* Where each song stood before the latest change, and which songs have been in the top before. */
function moveCtx(l, period){
  const N = l.size || 100;
  if(period !== 'cur'){
    const prevYear = ranked(l, period-1), ever = new Set();
    songsOf(l.id).forEach(s => { for(const y in s.pts) if(+y < period && +s.pts[y]) ever.add(s.id); });
    return { prev: prevYear.length ? orderMap(prevYear.map(s=>s.id)) : new Map(), ever, N, any: prevYear.length > 0 };
  }
  const rs = roundsOf(l.id), ever = new Set();
  if(l.base) for(const [k,v] of Object.entries(l.base)) if(v <= N) ever.add(k);
  rs.forEach((r,i) => { r.prev.slice(0,N).forEach(id => ever.add(id)); if(i < rs.length-1) r.order.slice(0,N).forEach(id => ever.add(id)); });
  const prev = rs.length ? orderMap(rs[rs.length-1].prev) : baseMap(l);
  return { prev, ever, N, any: prev.size > 0 };
}
function moveOf(ctx, id, pos){
  if(!ctx.any || pos > ctx.N) return '';
  const p = ctx.prev.get(id);
  if(p == null || p > ctx.N) return ctx.ever.has(id) ? '<span class="badge re">RE</span>' : '<span class="badge new">NEW</span>';
  const d = p - pos;
  return d > 0 ? '<span class="mv up">▲'+d+'</span>' : d < 0 ? '<span class="mv dn">▼'+(-d)+'</span>' : '<span class="mv eq">=</span>';
}

function listRows(l){
  const period = ui.period, all = ranked(l, period);
  if(!all.length) return '<div class="empty">'+esc(T('Nema pesama.'))+'</div>';
  const ctx = moveCtx(l, period), N = l.size || 100, q = norm(ui.q), cy = CY();
  let rows = all.map((s,i) => ({ s, pos:i+1 }));
  if(q) rows = rows.filter(r => norm(r.s.title+' '+r.s.artist).includes(q));
  if(!rows.length) return '<div class="empty">'+esc(T('Ništa nije pronađeno.'))+'</div>';
  const below = rows.filter(r => r.pos > N).length, showAll = q || ui.below;
  let h = '<div class="rows">';
  rows.forEach(r => {
    if(r.pos > N && !showAll) return;
    if(r.pos === N+1 && !q) h += '<button class="cut" data-a="below">— '+esc(T('Sakrij ispod crte'))+' —</button>';
    const s = r.s, sc = score(s, l, period);
    const small = period === 'cur' ? (+s.pts[cy] ? cy+': '+fmt(s.pts[cy]) : '') : T('zbir')+' '+fmt(total(s));
    h += '<div class="row'+(r.pos===1?' p1':'')+'" data-a="song" data-id="'+s.id+'"><div class="pos">'+r.pos+'</div><div class="mv">'+moveOf(ctx, s.id, r.pos)+'</div>'
      + '<div class="main"><div class="t">'+esc(s.title)+(l.showPl && s.pl ? '<i class="pl"></i>' : '')+'</div><div class="a">'+esc(s.artist)+'</div></div>'
      + '<div class="sc"><b>'+fmt(sc)+'</b><small>'+esc(small)+'</small></div></div>';
  });
  h += '</div>';
  if(below && !showAll) h += '<button class="cut" style="border:0" data-a="below">'+esc(T('Prikaži još {0} ispod crte', below))+'</button>';
  let note = '';
  if(period !== 'cur') note = T('Lista po godini {0}. Kretanje je u odnosu na {1}.', period, period-1);
  else if(roundsOf(l.id).length) note = T('Kretanje se računa od prethodnog kruga.');
  else if(l.base && l.basePos) note = T('Pozicija je iz tabele, a kretanje se računa od nje.');
  if(note) h += '<p class="note" style="text-align:center;margin-top:12px">'+esc(note)+'</p>';
  return h;
}

function artistGroups(l, period){
  const g = new Map();
  songsOf(l.id).forEach(s => {
    const k = norm(s.artist) || '?', sc = score(s, l, period);
    if(!g.has(k)) g.set(k, { names:{}, songs:[], sc:0 });
    const e = g.get(k); e.names[s.artist] = (e.names[s.artist]||0) + 1; e.songs.push(s); e.sc += sc;
  });
  return [...g.entries()].map(([k,e]) => ({ k, name:Object.entries(e.names).sort((a,b)=>b[1]-a[1])[0][0], songs:e.songs, sc:e.sc }))
    .filter(e => e.sc || period === 'cur').sort((a,b) => b.sc-a.sc || b.songs.length-a.songs.length || a.name.localeCompare(b.name));
}
function artistsView(l){
  const gs = artistGroups(l, ui.period);

function updateRoundInfo(){

function setAdd(id, val, rowEl, fromInput){

function startRound(){
  const l = curList(); if(!l) return;
  if(data.draft && data.draft.list !== l.id){ data.cur = data.draft.list; save(); render(); return; }
  data.draft = { list:l.id, year:CY(), at:new Date().toISOString(), adds:{}, order:ranked(l).map(s => s.id) };
  ui.below = false; save(); render(); window.scrollTo(0,0);
}
async function finishRound(){
  const d = data.draft, l = listById(d.list); if(!l){ data.draft = null; save(); render(); return; }
  const adds = {}; for(const [k,v] of Object.entries(d.adds)) if(v && songById(k)) adds[k] = v;
  if(!Object.keys(adds).length){
    if(!await confirmSheet(T('Završiti krug bez poena?'), T('Odbaci krug'))) return;
    data.draft = null; save(); render(); return;
  }
  const prev = ranked(l).map(s => s.id);
  for(const [id,v] of Object.entries(adds)){ const s = songById(id); s.pts[d.year] = Math.round(((+s.pts[d.year]||0) + v) * 100) / 100; if(!s.pts[d.year]) delete s.pts[d.year]; }
  const order = ranked(l, 'cur', orderMap(prev)).map(s => s.id);
  const r = { id:uid(), list:l.id, at:new Date().toISOString(), year:d.year, adds, prev, order };
  data.rounds.push(r); data.draft = null; ui.below = false;
  save(); render(); window.scrollTo(0,0);
  showRound(r, true);
}
function undoRound(r){
  const l = listById(r.list);
  for(const [id,v] of Object.entries(r.adds)){ const s = songById(id); if(!s) continue; s.pts[r.year] = Math.round(((+s.pts[r.year]||0) - v) * 100) / 100; if(!s.pts[r.year]) delete s.pts[r.year]; }
  data.rounds = data.rounds.filter(x => x !== r);
  save(); closeSheet(); render(); toast(T('Krug je poništen'));
}
function showRound(r, fresh){
  const l = listById(r.list), N = l.size || 100, rs = roundsOf(l.id), idx = rs.indexOf(r);
  const pm = orderMap(r.prev), om = orderMap(r.order), ever = new Set();
  if(l.base) for(const [k,v] of Object.entries(l.base)) if(v <= N) ever.add(k);
  rs.slice(0, idx).forEach(x => { x.prev.slice(0,N).forEach(id => ever.add(id)); x.order.slice(0,N).forEach(id => ever.add(id)); });
  const live = id => songById(id);
  const name = id => { const s = live(id); return s ? '<span class="x">'+esc(s.title)+' <small>'+esc(s.artist)+'</small></span>' : ''; };
  const ins = r.order.slice(0,N).filter(id => live(id) && !((pm.get(id)||1e9) <= N));
  const outs = r.prev.slice(0,N).filter(id => live(id) && (om.get(id)||1e9) > N);
  const moves = r.order.slice(0,N).filter(id => live(id) && (pm.get(id)||1e9) <= N).map(id => ({ id, d:pm.get(id) - om.get(id) }));
  const ups = moves.filter(m => m.d > 0).sort((a,b) => b.d-a.d).slice(0,5), dns = moves.filter(m => m.d < 0).sort((a,b) => a.d-b.d).slice(0,5);
  const sum = Object.values(r.adds).reduce((a,b) => a+b, 0), one = live(r.order[0]);
  let h = '<h2>'+esc(fresh ? T('Nova lista je spremna') : T('Krug')+' '+(idx+1))+'</h2><p class="sub">'+fdate(r.at)+' · '+r.year+' · +'+fmt(sum)+' '+esc(T('poena'))+' · '+Object.keys(r.adds).length+' '+esc(T('pesama'))+'</p>';
  if(one) h += '<div class="hero"><small>'+esc(r.prev[0] === r.order[0] ? T('Broj 1 i dalje') : T('Novi broj 1'))+'</small><b>'+esc(one.title)+'</b><span>'+esc(one.artist)+'</span></div>';
  const li = (arr, fn) => '<ul class="mini">'+arr.map(fn).join('')+'</ul>';
  if(ins.length) h += '<h4>'+esc(T('Ušle u top {0}', N))+'</h4>' + li(ins, id => '<li><span class="n">'+om.get(id)+'</span>'+name(id)+'<span class="r">'+(ever.has(id) ? '<span class="badge re">RE</span>' : '<span class="badge new">NEW</span>')+'</span></li>');
  if(ups.length) h += '<h4>'+esc(T('Najveći skokovi'))+'</h4>' + li(ups, m => '<li><span class="n">'+om.get(m.id)+'</span>'+name(m.id)+'<span class="r mv up">▲'+m.d+'</span></li>');
  if(dns.length) h += '<h4>'+esc(T('Najveći padovi'))+'</h4>' + li(dns, m => '<li><span class="n">'+om.get(m.id)+'</span>'+name(m.id)+'<span class="r mv dn">▼'+(-m.d)+'</span></li>');
  if(outs.length) h += '<h4>'+esc(T('Ispale iz top {0}', N))+'</h4>' + li(outs, id => '<li><span class="n">'+pm.get(id)+'</span>'+name(id)+'<span class="r mv dn">↓'+om.get(id)+'</span></li>');
  const addIds = Object.keys(r.adds).filter(live).sort((a,b) => r.adds[b]-r.adds[a]);
  if(addIds.length) h += '<h4>'+esc(T('Poeni'))+'</h4>' + li(addIds, id => '<li><span class="n">'+om.get(id)+'</span>'+name(id)+'<span class="r">+'+fmt(r.adds[id])+'</span></li>');
  h += '<div class="stack mt"><button class="btn primary block" data-a="close">'+esc(T('U redu'))+'</button>';
  if(idx === rs.length-1) h += '<button class="btn danger block" data-a="undoRound" data-id="'+r.id+'">'+esc(T('Poništi ovaj krug'))+'</button>';
  h += '</div>';
  openSheet(h);
}

function confirmSheet(msg, ok, danger = true){
  return new Promise(res => {
    let done = false;
    openSheet('<h2 style="margin-bottom:16px;line-height:1.35">'+esc(msg)+'</h2><div class="two"><button class="btn" id="cNo">'+esc(T('Otkaži'))+'</button><button class="btn '+(danger?'danger':'primary')+'" id="cYes">'+esc(ok)+'</button></div>', el => {
      el.querySelector('#cYes').onclick = () => { done = true; closeSheet(); res(true); };
      el.querySelector('#cNo').onclick = () => { done = true; closeSheet(); res(false); };

    const r = $('sheetRoot'), obs = new MutationObserver(() => { if(!r.classList.contains('open')){ obs.disconnect(); if(!done) res(false); } });
    obs.observe(r, { attributes:true });
  });
}

function posChart(pts, N){
  if(pts.length < 2) return '';
  const W = 320, H = 150, pl = 30, pr = 10, pt = 12, pb = 22;
  const maxP = Math.max(...pts.map(p => p.p), Math.min(N, 10));
  const x = i => pl + (W-pl-pr) * i / (pts.length-1), y = p => pt + (H-pt-pb) * (p-1) / Math.max(1, maxP-1);
  const line = pts.map((p,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.p).toFixed(1)).join(' ');
  const cutY = N < maxP ? '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(N+.5)+'" y2="'+y(N+.5)+'" stroke="var(--muted)" stroke-dasharray="3 4" opacity=".6"/>' : '';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'"><text x="4" y="'+(y(1)+4)+'" font-size="10" font-weight="700" fill="var(--muted)">#1</text><text x="4" y="'+(y(maxP)+4)+'" font-size="10" font-weight="700" fill="var(--muted)">#'+maxP+'</text>'
    + cutY + '<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'
    + pts.map((p,i) => '<circle cx="'+x(i)+'" cy="'+y(p.p)+'" r="'+(pts.length > 40 ? 1.8 : 3)+'" fill="var(--accent)"/>').join('')
    + '<text x="'+pl+'" y="'+(H-6)+'" font-size="10" font-weight="700" fill="var(--muted)">'+esc(pts[0].label)+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end" font-size="10" font-weight="700" fill="var(--muted)">'+esc(pts[pts.length-1].label)+'</text></svg>';
}
function barChart(s, years){
  const vals = years.map(y => +s.pts[y] || 0); if(!vals.some(v => v)) return '';
  const W = 320, H = 130, pb = 18, pt = 14, max = Math.max(...vals), bw = (W-8) / years.length;
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'">' + years.map((y,i) => {
    const v = vals[i], h = max ? (H-pt-pb) * v / max : 0, x = 4 + i*bw;
    return '<rect x="'+(x+bw*.18)+'" y="'+(H-pb-h)+'" width="'+(bw*.64)+'" height="'+Math.max(h, v?2:0)+'" rx="3" fill="var(--accent)" opacity="'+(y===CY()?1:.7)+'"/>'
      + (v ? '<text x="'+(x+bw/2)+'" y="'+(H-pb-h-3)+'" text-anchor="middle" font-size="9" font-weight="800" fill="var(--text)">'+fmt(v)+'</text>' : '')
      + (years.length <= 12 || i % 2 === 0 ? '<text x="'+(x+bw/2)+'" y="'+(H-5)+'" text-anchor="middle" font-size="9" font-weight="700" fill="var(--muted)">\''+String(y).slice(2)+'</text>' : '');
  }).join('') + '</svg>';
}

      const nl = el.querySelector('#eL'); let moved = false;

    ch.setUint32(16,crc,true); ch.setUint32(20,body.length,true); ch.setUint32(24,body.length,true); ch.setUint16(28,name.length,true); ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer), name);
    off += 30 + name.length + body.length;
  });
  const cenSize = cen.reduce((a,b) => a + b.length, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,cenSize,true); end.setUint32(16,off,true);
  const all = [...parts, ...cen, new Uint8Array(end.buffer)], out = new Uint8Array(all.reduce((a,b) => a + b.length, 0));

}
const xesc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
function colName(i){ let s = ''; i++; while(i){ const m = (i-1) % 26; s = String.fromCharCode(65+m) + s; i = Math.floor((i-1) / 26); } return s; }
function sheetXml(rows){
  let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetData>';
  rows.forEach((r, ri) => {
    x += '<row r="'+(ri+1)+'">';
    r.forEach((v, ci) => {
      if(v === '' || v == null) return;
      const ref = colName(ci) + (ri+1), st = ri === 0 ? ' s="1"' : '';
      x += typeof v === 'number' ? '<c r="'+ref+'"'+st+'><v>'+v+'</v></c>' : '<c r="'+ref+'" t="inlineStr"'+st+'><is><t xml:space="preserve">'+xesc(v)+'</t></is></c>';
    });
    x += '</row>';
  });
  return x + '</sheetData></worksheet>';
}
function exportXlsx(lists){
  const used = new Set(), sheets = lists.map(l => {
    const years = yearsOf(l), rows = [[T('Pozicija'), T('Naziv'), T('Izvođač'), ...years, T('Ukupno'), ...(l.showPl ? [T('Plejlista')] : [])]];
    ranked(l).forEach((s,i) => rows.push([i+1, s.title, s.artist, ...years.map(y => +s.pts[y] || ''), total(s), ...(l.showPl ? [s.pl ? T('Da') : ''] : [])]));
    let name = l.name.replace(/[\[\]:*?\/\\]/g, ' ').slice(0,31).trim() || 'List', base = name, k = 2;
    while(used.has(name.toLowerCase())) name = base.slice(0,28) + ' ' + (k++);
    used.add(name.toLowerCase());
    return { name, xml:sheetXml(rows) };
  });
  const NS = 'http://schemas.openxmlformats.org/', files = [
    { name:'[Content_Types].xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="'+NS+'package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
      + sheets.map((s,i) => '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('') + '</Types>' },
    { name:'_rels/.rels', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="'+NS+'package/2006/relationships"><Relationship Id="rId1" Type="'+NS+'officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { name:'xl/workbook.xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="'+NS+'spreadsheetml/2006/main" xmlns:r="'+NS+'officeDocument/2006/relationships"><sheets>' + sheets.map((s,i) => '<sheet name="'+xesc(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('') + '</sheets></workbook>' },
    { name:'xl/_rels/workbook.xml.rels', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="'+NS+'package/2006/relationships">' + sheets.map((s,i) => '<Relationship Id="rId'+(i+1)+'" Type="'+NS+'officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('') + '<Relationship Id="rId'+(sheets.length+1)+'" Type="'+NS+'officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
    { name:'xl/styles.xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="'+NS+'spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>' },
    ...sheets.map((s,i) => ({ name:'xl/worksheets/sheet'+(i+1)+'.xml', text:s.xml }))
  ];
  const bytes = zip(files), name = 'top100-' + new Date().toISOString().slice(0,10) + '.xlsx';
  saveBytes(name, bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
function saveBytes(name, bytes, mime){
  if(window.Top100Android && Top100Android.saveBase64){
    let bin = ''; for(let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    Top100Android.saveBase64(name, mime, btoa(bin)); return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes], { type:mime })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast(T('Izvezeno'));
}
function backup(){
  const d = Object.assign({ app:'top100', exported:new Date().toISOString() }, data);
  saveBytes('top100-backup-' + new Date().toISOString().slice(0,10) + '.json', new TextEncoder().encode(JSON.stringify(d)), 'application/json');
}
function restore(){
  const inp = $('fileIn'); inp.value = ''; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if(!f) return;
    let d; try{ d = JSON.parse(await f.text()); }catch(e){ d = null; }
    if(!d || d.app !== 'top100' || !Array.isArray(d.lists) || !Array.isArray(d.songs)){ toast(T('Ovo nije rezervna kopija Top 100.')); return; }
    if(!await confirmSheet(T('Zameniti sve trenutne podatke podacima iz kopije?'), T('Zameni'))) return;
    delete d.app; delete d.exported; data = fix(d); save(); render(); toast(T('Rezervna kopija je vraćena'));
  };
  inp.click();
}

/* ================= events ================= */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  const row = el.closest('.rrow');
  switch(a){
    case 'close': closeSheet(); break;
    case 'settings': openSettings(); break;
    case 'pick': data.cur = id; ui.view = 'list'; ui.period = 'cur'; ui.q = ''; ui.below = false; save(); render(); window.scrollTo(0,0); break;
    case 'newList': closeSheet(); newListSheet(); break;
    case 'import': closeSheet(); pickImportFile(); break;
    case 'exportAll': exportXlsx(data.lists); break;
    case 'backup': backup(); break;
    case 'restore': closeSheet(); restore(); break;
    case 'update': if(window.Top100Android && Top100Android.checkForUpdate) Top100Android.checkForUpdate(); break;
    case 'listSettings': listSettings(); break;
    case 'view': ui.view = el.dataset.v; render(); break;
    case 'period': ui.period = el.dataset.v === 'cur' ? 'cur' : +el.dataset.v; ui.below = false; render(); break;
    case 'below':
      ui.below = !ui.below;
      if(data.draft && $('rrows')){
        document.querySelectorAll('.rrow.bl').forEach(r => r.classList.toggle('hide', !ui.below));
        el.textContent = ui.below ? T('Sakrij ispod crte') : T('Prikaži još {0} ispod crte', document.querySelectorAll('.rrow.bl').length);
      } else $('rows').innerHTML = listRows(curList());
      break;
    case 'song': closeSheet(); openSong(id); break;
    case 'artist': openArtist(el.dataset.k); break;
    case 'addSong': openAddSong(); break;
    case 'startRound': startRound(); break;
    case 'round': { const r = data.rounds.find(x => x.id === id); if(r) showRound(r, false); break; }
    case 'undoRound': {
      const r = data.rounds.find(x => x.id === id); if(!r) break;
      closeSheet();
      if(await confirmSheet(T('Poništiti poslednji krug? Njegovi poeni se oduzimaju.'), T('Poništi'))) undoRound(r);
      break;
    }
    case 'plus': if(row) setAdd(row.dataset.id, (data.draft.adds[row.dataset.id] || 0) + +el.dataset.v, row); break;
    case 'minus': if(row){ const cur = data.draft.adds[row.dataset.id] || 0, step = data.settings.quick[0] || 1; setAdd(row.dataset.id, cur > 0 ? Math.max(0, cur - step) : cur < 0 ? Math.min(0, cur + step) : 0, row); } break;
    case 'finish': finishRound(); break;
    case 'roundMenu': roundMenu(); break;
    case 'roundYear': roundYear(); break;
    case 'set': {
      data.settings[el.dataset.k] = el.dataset.v; save(); render();
      closeSheet(); openSettings(); break;
    }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'q'){ ui.q = t.value; ui.below = false; $('rows').innerHTML = listRows(curList()); }
  else if(t.id === 'rq'){
    const q = norm(t.value);
    document.querySelectorAll('.rrow').forEach(r => r.classList.toggle('hide', q ? !r.dataset.s.includes(q) : (r.classList.contains('bl') && !ui.below)));
    const cut = $('rcut'); if(cut) cut.classList.toggle('hide', !!q);
  }
  else if(t.classList.contains('cnt')){ const row = t.closest('.rrow'); setAdd(row.dataset.id, numv(t.value) || 0, row, true); }
});
document.addEventListener('focusin', e => { if(e.target.classList && e.target.classList.contains('cnt')) e.target.select(); });
function roundMenu(){
  openSheet('<h2>'+esc(T('Krug u toku'))+'</h2><p class="sub">'+esc(T('Pokrenut'))+' '+fdate(data.draft.at)+'</p><div class="stack">'
    + '<button class="btn block" data-a="roundYear">'+esc(T('Promeni godinu'))+' ('+data.draft.year+')</button>'
    + '<button class="btn block" id="rmAdd">'+esc(T('Dodaj pesmu'))+'</button>'
    + '<button class="btn danger block" id="rmX">'+esc(T('Odbaci krug'))+'</button>'
    + '<button class="btn primary block" data-a="close">'+esc(T('Zatvori'))+'</button></div>', el => {
    el.querySelector('#rmAdd').onclick = () => { closeSheet(); openAddSong(); };
    el.querySelector('#rmX').onclick = async () => {
      closeSheet();
      if(!await confirmSheet(T('Odbaciti ovaj krug? Uneti poeni se brišu.'), T('Odbaci'))) return;
      data.draft = null; save(); render();
    };
  });
}
function roundYear(){
  const y = CY(), opts = [y+1, y, y-1, y-2, y-3];
  closeSheet();
  openSheet('<h2>'+esc(T('Promeni godinu'))+'</h2><p class="sub">'+esc(T('poeni idu u godinu'))+'</p><div class="chips" style="flex-wrap:wrap">'
    + opts.map(v => '<button class="chip'+(data.draft.year===v?' on':'')+'" data-y="'+v+'">'+v+'</button>').join('') + '</div><input class="field mt" id="ryI" type="number" inputmode="numeric" value="'+data.draft.year+'">'
    + '<div class="two mt"><button class="btn" data-a="close">'+esc(T('Otkaži'))+'</button><button class="btn primary" id="ryOk">'+esc(T('Sačuvaj'))+'</button></div>', el => {
    el.querySelectorAll('[data-y]').forEach(b => b.onclick = () => { el.querySelector('#ryI').value = b.dataset.y; el.querySelectorAll('[data-y]').forEach(x => x.classList.toggle('on', x === b)); });
    el.querySelector('#ryOk').onclick = () => {
      const v = Math.round(+el.querySelector('#ryI').value);
      if(v >= 1900 && v <= 2200){ data.draft.year = v; save(); }
      closeSheet(); render();
    };
  });
}

render();
if(window.Top100Android && Top100Android.ready) Top100Android.ready();
if('serviceWorker' in navigator && location.protocol === 'https:' && !window.Top100Android){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
